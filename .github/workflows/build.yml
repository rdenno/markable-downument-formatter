name: Build installers

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag (e.g. v0.1.0). Leave empty to just build.'
        required: false
        default: ''
      target:
        description: 'Branch or commit the release tag points at'
        required: false
        default: 'main'
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              out/*.exe
          - os: ubuntu-latest
            target: --linux
            files: |
              out/*.AppImage
              out/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Markable-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Publishes a GitHub release with each installer attached as its own file, when
  # a tag like v0.1.0 is pushed, or when run manually with the "release" input
  # (which creates the tag on "target").
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ inputs.target || github.sha }}
          name: Markable ${{ inputs.release || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
